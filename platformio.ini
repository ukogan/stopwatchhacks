; M5Stack StopWatch (C152) as a Bluetooth Google TV remote.
; Board settings follow M5Stack's StopWatch PlatformIO guide.

[env:stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
monitor_speed = 115200
lib_deps =
    https://github.com/m5stack/M5GFX.git
    https://github.com/m5stack/M5Unified.git
    h2zero/NimBLE-Arduino @ ~1.4.3

; Speaker test: plays a voice clip, a short tune and a tone sweep.
[env:audiotest]
extends = env:stopwatch
build_flags =
    ${env:stopwatch.build_flags}
    -DAUDIO_TEST
